services:
  postgres:
    image: postgres:16-alpine
    container_name: qrmaster-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: qrmaster
    ports:
      - "5432:5432"
    volumes:
      - qrmaster_pgdata:/var/lib/postgresql/data

volumes:
  qrmaster_pgdata:
